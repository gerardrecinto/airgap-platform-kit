---
# FIPS-approved algorithm lists as shipped by OpenSSH on RHEL 9.
stig_baseline::ssh::ciphers:
  - aes256-gcm@openssh.com
  - aes256-ctr
  - aes128-gcm@openssh.com
  - aes128-ctr
stig_baseline::ssh::macs:
  - hmac-sha2-512-etm@openssh.com
  - hmac-sha2-256-etm@openssh.com
  - hmac-sha2-512
  - hmac-sha2-256
